# Builds the one-click WordPress Playground test page from the latest code on demand.
# Run it from the Actions tab: "Build Playground link" > "Run workflow".
# The page is attached to the run as the playground.html download (not zipped).

name: Build Playground link

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build the Playground test page
        run: python tools/build_playground.py

      - uses: actions/upload-artifact@v7
        with:
          path: dist/playground.html
          archive: false
          retention-days: 30
